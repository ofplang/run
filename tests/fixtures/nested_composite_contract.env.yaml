# Environment for nested_composite_contract.workflow.yaml. `pre` and `inc` are
# device-less Pure-Data-only script processes (§22.1 / §5.5): no device, no spot.
# `inc` runs after `pre` (Pure Data precedence through `wrap`), so the makespan is
# 1 + 1 = 2. The scheduler requires at least one device to exist, so a single
# unused rack is declared (no script op ever touches it).
time:
  unit: second

devices:
  - { id: rack, spots: [slot] }
transporters:
  - { id: arm }
transports: []

processes:

  pre:
    modes:
      - { id: v0, duration: 1 }

  inc:
    modes:
      - { id: v0, duration: 1 }
