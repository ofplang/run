# A three-tray oven, for `two_branch.workflow.yaml`.
#
# Three rather than two so a job that stops mid-flight still leaves the others
# somewhere to work: its own plate holds one tray, the conservative claim on the
# transport that failed holds another, and the third is what the test is about.
#
# 🔴 `tray_1` is the big tray and the only one a big plate fits, and a big plate
# takes three times as long to prepare. That is what makes the failing route
# (`bench.* -> oven.tray_1`) and its moment (after the small plate is already
# baking) properties of this laboratory rather than of whichever bay the scheduler
# felt like handing out -- see the workflow for why that had to be pinned.
#
# `assay`/`assay_big` declare `device_access: false`, so it is the trays that are
# scarce rather than the oven.

time:
  unit: second

devices:
  - id: bench
    spots: [slot_a, slot_b]
  - id: oven
    spots: [tray_1, tray_2, tray_3, tray_4]
  - id: bin
    spots: [chute]

transporters:
  - id: arm

transports:
  - { transporter: arm, from: bench.slot_a, to: oven.tray_1, duration: 1 }
  - { transporter: arm, from: bench.slot_a, to: oven.tray_2, duration: 1 }
  - { transporter: arm, from: bench.slot_a, to: oven.tray_3, duration: 1 }
  - { transporter: arm, from: bench.slot_b, to: oven.tray_1, duration: 1 }
  - { transporter: arm, from: bench.slot_b, to: oven.tray_2, duration: 1 }
  - { transporter: arm, from: bench.slot_b, to: oven.tray_3, duration: 1 }
  - { transporter: arm, from: bench.slot_a, to: oven.tray_4, duration: 3 }
  - { transporter: arm, from: bench.slot_b, to: oven.tray_4, duration: 3 }
  - { transporter: arm, from: oven.tray_4, to: bin.chute, duration: 1 }
  - { transporter: arm, from: oven.tray_1, to: bin.chute, duration: 1 }
  - { transporter: arm, from: oven.tray_2, to: bin.chute, duration: 1 }
  - { transporter: arm, from: oven.tray_3, to: bin.chute, duration: 1 }

processes:

  make_plate:
    modes:
      - id: slot_a
        devices: [bench]
        duration: 2
        output_spots: { plate: bench.slot_a }
      - id: slot_b
        devices: [bench]
        duration: 2
        output_spots: { plate: bench.slot_b }

  make_wide_plate:
    modes:
      - id: slot_a
        devices: [bench]
        duration: 6
        output_spots: { plate: bench.slot_a }
      - id: slot_b
        devices: [bench]
        duration: 6
        output_spots: { plate: bench.slot_b }

  assay:
    modes:
      - id: tray_2
        devices: [oven]
        device_access: false
        duration: 30
        input_spots:  { plate: oven.tray_2 }
        output_spots: { out: oven.tray_2 }
      - id: tray_3
        devices: [oven]
        device_access: false
        duration: 30
        input_spots:  { plate: oven.tray_3 }
        output_spots: { out: oven.tray_3 }

  assay_wide:
    modes:
      - id: tray_1
        devices: [oven]
        device_access: false
        duration: 20
        input_spots:  { plate: oven.tray_1 }
        output_spots: { out: oven.tray_1 }
      - id: tray_4
        devices: [oven]
        device_access: false
        duration: 20
        input_spots:  { plate: oven.tray_4 }
        output_spots: { out: oven.tray_4 }

  discard:
    modes:
      - devices: [bin]
        duration: 1
        input_spots: { plate: bin.chute }
