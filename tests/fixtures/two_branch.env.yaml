# A three-tray oven, for `two_branch.workflow.yaml`.
#
# Three rather than two so a job that stops mid-flight still leaves the others
# somewhere to work: its own plate holds one tray, the conservative claim on the
# transport that failed holds another, and the third is what the test is about.
time:
  unit: second
devices:
- id: bench
  spots:
  - slot_a
  - slot_b
- id: oven
  spots:
  - tray_1
  - tray_2
  - tray_3
- id: bin
  spots:
  - chute
transporters:
- id: arm
transports:
- transporter: arm
  from: bench.slot_a
  to: oven.tray_1
  duration: 1
- transporter: arm
  from: bench.slot_a
  to: oven.tray_2
  duration: 1
- transporter: arm
  from: bench.slot_b
  to: oven.tray_1
  duration: 1
- transporter: arm
  from: bench.slot_b
  to: oven.tray_2
  duration: 1
- transporter: arm
  from: oven.tray_1
  to: bin.chute
  duration: 1
- transporter: arm
  from: oven.tray_2
  to: bin.chute
  duration: 1
- transporter: arm
  from: bench.slot_a
  to: oven.tray_3
  duration: 1
- transporter: arm
  from: bench.slot_b
  to: oven.tray_3
  duration: 1
- transporter: arm
  from: oven.tray_3
  to: bin.chute
  duration: 1
processes:
  make_plate:
    modes:
    - id: slot_a
      devices:
      - bench
      duration: 2
      output_spots:
        plate: bench.slot_a
    - id: slot_b
      devices:
      - bench
      duration: 2
      output_spots:
        plate: bench.slot_b
  assay:
    modes:
    - id: tray_1
      devices:
      - oven
      device_access: false
      duration: 20
      input_spots:
        plate: oven.tray_1
      output_spots:
        out: oven.tray_1
    - id: tray_2
      devices:
      - oven
      device_access: false
      duration: 20
      input_spots:
        plate: oven.tray_2
      output_spots:
        out: oven.tray_2
    - id: tray_3
      devices:
      - oven
      device_access: false
      duration: 20
      input_spots:
        plate: oven.tray_3
      output_spots:
        out: oven.tray_3
  discard:
    modes:
    - devices:
      - bin
      duration: 1
      input_spots:
        plate: bin.chute
