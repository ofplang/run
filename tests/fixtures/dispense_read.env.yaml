# Environment for dispense_read.workflow.yaml.
#
# Plates wait in a three-slot `hotel`; the reagent container sits on a `shelf`. The
# `dispenser` takes one plate at a time with the container beside it, and there are
# two plate readers, so two reads can run at once. Read plates go to a three-slot
# `rack`. One arm moves everything.

time:
  unit: second

devices:
  - id: hotel
    spots: [a, b, c]
  - id: shelf
    spots: [r]
  - id: dispenser
    spots: [stage, reagent]
  - id: reader_1
    spots: [stage]
  - id: reader_2
    spots: [stage]
  - id: rack
    spots: [a, b, c]

transporters:
  - id: arm

transports:
  - { transporter: arm, from: hotel.a, to: dispenser.stage, duration: 3 }
  - { transporter: arm, from: hotel.b, to: dispenser.stage, duration: 3 }
  - { transporter: arm, from: hotel.c, to: dispenser.stage, duration: 3 }
  - { transporter: arm, from: shelf.r, to: dispenser.reagent, duration: 3 }
  - { transporter: arm, from: dispenser.reagent, to: shelf.r, duration: 3 }
  - { transporter: arm, from: dispenser.stage, to: reader_1.stage, duration: 2 }
  - { transporter: arm, from: dispenser.stage, to: reader_2.stage, duration: 2 }
  - { transporter: arm, from: reader_1.stage, to: rack.a, duration: 2 }
  - { transporter: arm, from: reader_1.stage, to: rack.b, duration: 2 }
  - { transporter: arm, from: reader_1.stage, to: rack.c, duration: 2 }
  - { transporter: arm, from: reader_2.stage, to: rack.a, duration: 2 }
  - { transporter: arm, from: reader_2.stage, to: rack.b, duration: 2 }
  - { transporter: arm, from: reader_2.stage, to: rack.c, duration: 2 }

processes:

  dispense:
    modes:
      - devices: [dispenser]
        duration: 5
        input_spots:  { plate: dispenser.stage, reagent: dispenser.reagent }
        output_spots: { plate: dispenser.stage, reagent: dispenser.reagent }

  read:
    modes:
      - devices: [reader_1]
        duration: 20
        input_spots:  { plate: reader_1.stage }
        output_spots: { plate: reader_1.stage }
      - devices: [reader_2]               # an older, slower reader
        duration: 25
        input_spots:  { plate: reader_2.stage }
        output_spots: { plate: reader_2.stage }
