# Environment for preflight.workflow.yaml. `slow` and `check` are device-less
# Pure-Data-only script processes (§22.1 / §5.5). `slow` takes 5 units so that
# `check` (which consumes Slow.d) would only dispatch at t=5 -- making the run-start
# preflight of `check`'s run-phase precondition observable (it fires at t=0). The
# scheduler requires at least one device to exist, so a single unused rack is declared.
time:
  unit: second

devices:
  - { id: rack, spots: [slot] }
transporters:
  - { id: arm }
transports: []

processes:

  slow:
    modes:
      - { id: v0, duration: 5 }

  check:
    modes:
      - { id: v0, duration: 1 }

objective:
  kind: makespan
