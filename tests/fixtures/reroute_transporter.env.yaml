# Environment fixture for re-routing onto another *transporter* (D39).
#
# The one route station_0.core -> station_1.core is served by two transporters:
# `arm_a` carries it in 1, `arm_b` in 4 (two entries are legal -- a transport is
# identified by the (transporter, from, to) triple). So the cheap plan always uses
# arm_a (makespan 5 = source 2 + move 1 + target 2); with arm_a down its entry is
# dropped and the same route is carried by arm_b instead (makespan 8), which is how
# a test tells which transporter was used -- the status document records a
# transport's spots but not its transporter.
#
# Contrast reroute.env.yaml, where the alternative is a different *device*.
time:
  unit: second

devices:
  - id: station_0
    spots: [core]
  - id: station_1
    spots: [core]

transporters:
  - id: arm_a
  - id: arm_b

transports:
  - { transporter: arm_a, from: station_0.core, to: station_1.core, duration: 1 }
  - { transporter: arm_b, from: station_0.core, to: station_1.core, duration: 4 }

processes:

  source:
    modes:
      - devices: [station_0]
        duration: 2
        output_spots:
          source_out: station_0.core

  target:
    modes:
      - devices: [station_1]
        duration: 2
        input_spots:
          target_in: station_1.core

objective:
  kind: makespan
