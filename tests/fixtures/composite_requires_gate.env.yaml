# Environment for composite_requires_gate.workflow.yaml: device-less Pure-Data
# script processes (§22.1 / §5.5). One unused device satisfies the scheduler.
time: { unit: second }
devices: [ { id: rack, spots: [slot] } ]
transporters: [ { id: arm } ]
transports: []
processes:
  pre: { modes: [ { id: v0, duration: 1 } ] }
  make: { modes: [ { id: v0, duration: 1 } ] }
  combine: { modes: [ { id: v0, duration: 1 } ] }
