# Environment for producer_run_phase.workflow.yaml: device-less Pure-Data script
# processes (§22.1 / §5.5). A single unused device satisfies the scheduler.
time:
  unit: second
devices:
  - { id: rack, spots: [slot] }
transporters:
  - { id: arm }
transports: []
processes:
  src:
    modes:
      - { id: v0, duration: 1 }
  check:
    modes:
      - { id: v0, duration: 1 }
objective:
  kind: makespan
