# Valid portable v0 (spec §17). `main` repeats `step` until its `continue` output is
# false, so how many times it runs is something only the values decide. It used to be
# refused by the capability gate as "valid v0 but unsupported"; a `do_while` is run now
# (schedule D65), invocation by invocation, and this one is refused only for what the
# laboratory it is run against lacks.
spec_version: "0.4"
features:
  - node_do_while
processes:
  step:
    kind: atomic
    inputs: {n: {type: Int, phase: data}}
    outputs:
      n: {type: Int, phase: data}
      continue: {type: Bool, phase: data}
  main:
    kind: composite
    inputs:
      n0: {type: Int, phase: data}
      budget: {type: Int, phase: run}
    body:
      nodes:
        - id: count_down
          kind: do_while
          process: step
          carry:
            n: {from: inputs.n0}
          condition: {output: continue}
          max_iterations: {from: inputs.budget}
          outputs:
            n: {mode: carry}
            continue: {mode: drop}
      returns: {}
entry: main
