# Environment for static_view.workflow.yaml. `tag` and `use` are device-less
# Pure-Data-only script processes (§22.1 / §5.5): no device, no spot. `use` runs
# after `tag` (Pure Data precedence), so the makespan is 1 + 1 = 2. The scheduler
# requires at least one device to exist, so a single unused rack is declared.
time:
  unit: second

devices:
  - { id: rack, spots: [slot] }
transporters:
  - { id: arm }
transports: []

processes:

  tag:
    modes:
      - { id: v0, duration: 1 }

  use:
    modes:
      - { id: v0, duration: 1 }

objective:
  kind: makespan
