# `consumable.env.yaml` plus the ability to refill the stock: a `dispenser` that can
# top `station_1` up (SPEC §5.6 / §5.7).
#
# This environment is *scheduleable* but not *runnable* here: the scheduler answers it
# with `kind: replenishment` activities, and the runner has no dispatch for one, so it
# refuses the environment before anything starts (see `_refusable_replenishment`).
# It exists to pin that refusal, and to be the fixture the refill executor inherits.
time:
  unit: second

devices:
  - id: station_0
    spots: [core]
  - id: station_1
    spots: [core]
    resources:
      reagent: { capacity: 4 }

transporters:
  - id: transport

replenishers:
  - id: dispenser

replenishments:
  - { replenisher: dispenser, device: station_1, duration: 2 }

transports:
  - { transporter: transport, from: station_0.core, to: station_1.core, duration: 1 }

processes:

  source:
    modes:
      - devices: [station_0]
        duration: 2
        output_spots:
          source_out: station_0.core

  target:
    modes:
      - devices: [station_1]
        duration: 2
        input_spots:
          target_in: station_1.core
        consumption: { station_1.reagent: 1 }
