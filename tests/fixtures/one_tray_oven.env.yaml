# One tray in the oven — `stopped_job.env.yaml` narrowed to a single bay.
#
# 🔴 Why a separate laboratory rather than the two-tray one: this fixture exists to
# stage a replan that *nothing* can be planned from, and with two trays whether that
# happens is not a property of the laboratory. A move that fails holds both of its
# ends, and with two trays the other job simply takes the one that is free -- so
# whether the run paints itself into a corner comes down to which of two
# interchangeable bays the scheduler handed each job, which is its free choice and
# not something a test may pin. (It flipped on `ofplang-schedule` 0.11.0, which
# collapses interchangeable bays and hands them out after the solve.)
#
# With one tray there is no choice to make: the failed move holds `bench.slot_a` and
# the only tray there is, and the job that has not started has nowhere to go. The
# corner is then structural.
#
# Otherwise identical to `stopped_job.env.yaml`: `bake` declares
# `device_access: false`, so it is the tray that is scarce rather than the machine.

time:
  unit: second

devices:
  - id: bench
    spots: [slot_a, slot_b]
  - id: oven
    spots: [tray_1]
  - id: bin
    spots: [chute]

transporters:
  - id: arm

transports:
  - { transporter: arm, from: bench.slot_a, to: oven.tray_1, duration: 1 }
  - { transporter: arm, from: bench.slot_b, to: oven.tray_1, duration: 1 }
  - { transporter: arm, from: oven.tray_1, to: bin.chute, duration: 1 }

processes:

  make_plate:
    modes:
      - id: slot_a
        devices: [bench]
        duration: 2
        output_spots: { plate: bench.slot_a }
      - id: slot_b
        devices: [bench]
        duration: 2
        output_spots: { plate: bench.slot_b }

  assay:
    modes:
      - id: tray_1
        devices: [oven]
        device_access: false
        duration: 20
        input_spots:  { plate: oven.tray_1 }
        output_spots: { out: oven.tray_1 }

  discard:
    modes:
      - devices: [bin]
        duration: 1
        input_spots: { plate: bin.chute }
