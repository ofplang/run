# `two_branch.env.yaml` with two trays instead of three.
#
# A narrower oven, so a job that stops mid-flight really does cost the other job
# its parallelism: the small plates share `tray_2` and the big ones share `tray_1`,
# and a plate stranded on either is felt. That contention is the point for the test
# that checks a *running* activity's spots are not also reported as residue -- with
# room to spare, describing the same material twice would not show.
#
# Otherwise as `two_branch.env.yaml`, including why `tray_1` is the big tray: see
# the header there, and the workflow's, for why the failing route may not be left
# to the scheduler's choice of bay.

time:
  unit: second

devices:
  - id: bench
    spots: [slot_a, slot_b]
  - id: oven
    spots: [tray_1, tray_2]
  - id: bin
    spots: [chute]

transporters:
  - id: arm

transports:
  - { transporter: arm, from: bench.slot_a, to: oven.tray_1, duration: 1 }
  - { transporter: arm, from: bench.slot_a, to: oven.tray_2, duration: 1 }
  - { transporter: arm, from: bench.slot_b, to: oven.tray_1, duration: 1 }
  - { transporter: arm, from: bench.slot_b, to: oven.tray_2, duration: 1 }
  - { transporter: arm, from: oven.tray_1, to: bin.chute, duration: 1 }
  - { transporter: arm, from: oven.tray_2, to: bin.chute, duration: 1 }

processes:

  make_plate:
    modes:
      - id: slot_a
        devices: [bench]
        duration: 2
        output_spots: { plate: bench.slot_a }
      - id: slot_b
        devices: [bench]
        duration: 2
        output_spots: { plate: bench.slot_b }

  make_wide_plate:
    modes:
      - id: slot_a
        devices: [bench]
        duration: 2
        output_spots: { plate: bench.slot_a }
      - id: slot_b
        devices: [bench]
        duration: 2
        output_spots: { plate: bench.slot_b }

  assay:
    modes:
      - id: tray_2
        devices: [oven]
        device_access: false
        duration: 30
        input_spots:  { plate: oven.tray_2 }
        output_spots: { out: oven.tray_2 }

  assay_wide:
    modes:
      - id: tray_1
        devices: [oven]
        device_access: false
        duration: 20
        input_spots:  { plate: oven.tray_1 }
        output_spots: { out: oven.tray_1 }

  discard:
    modes:
      - devices: [bin]
        duration: 1
        input_spots: { plate: bin.chute }
