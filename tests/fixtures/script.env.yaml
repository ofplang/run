# Environment for script.workflow.yaml. `add` and `label` are device-less
# Pure-Data-only script processes (§22.1 / §5.5): they hold no device and no spot.
# Their `duration` is the scheduler's estimate of the compute cost (dev-notes D31):
# non-zero here to show that a script op takes simulation time like any other -- it
# is `running` over [start, start + duration] and its computed outputs appear only
# when it completes at `end`. `label` runs after `add` (Pure Data precedence), so
# the makespan is 2 + 3 = 5. The scheduler still requires at least one device to
# exist, so a single unused rack is declared (no script op ever touches it).
time:
  unit: second

devices:
  - { id: rack, spots: [slot] }
transporters:
  - { id: arm }
transports: []

processes:

  add:
    modes:
      - { id: v0, duration: 2 }

  label:
    modes:
      - { id: v0, duration: 3 }

objective:
  kind: makespan
