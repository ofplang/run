# Environment fixture for simple.workflow.yaml with a device-local consumable
# (SPEC §5.2 / §5.5): `station_1` holds a `reagent` and `target` draws one per run.
#
# Capacity is what the device can ever hold, not what it holds now -- what it holds
# when the run begins is a property of the run, so it lives in the run boundary
# (`boundary.inventories.levels`, §6.10) instead.
#
# No `replenishers` / `replenishments`: this is a stock an operator tops up outside
# the schedule, which is the only shape this runner can execute today (a planned
# refill has no dispatch, so `consumable_refill.env.yaml` is refused up front).
time:
  unit: second

devices:
  - id: station_0
    spots: [core]
  - id: station_1
    spots: [core]
    resources:
      reagent: { capacity: 4 }

transporters:
  - id: transport

transports:
  - { transporter: transport, from: station_0.core, to: station_1.core, duration: 1 }

processes:

  source:
    modes:
      - devices: [station_0]
        duration: 2
        output_spots:
          source_out: station_0.core

  target:
    modes:
      - devices: [station_1]
        duration: 2
        input_spots:
          target_in: station_1.core
        consumption: { station_1.reagent: 1 }
