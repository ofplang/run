# Valid portable v0 (spec §17) that cannot be planned.
#
# `main` invokes `make` once per element of `labels`, so the node's `cup` output leaves
# it as `Array<Cup>` rather than `Cup`. The scheduler expands a `map` into its
# invocations before planning, which needs their count before the run -- and
# `labels` is Pure Data, whose length only its value shows. Nothing else here gives
# the count (no Array of Objects at the boundary, no literal), so the run is refused
# with `array_length_unknown` before anything runs.
#
# The `cups` output port and its `returns` entry are what make the document valid:
# a map node's exposed Object output is subject to linearity (spec 12.2), so the
# `Array<Cup>` has to be referred to exactly once. Without them the Cups the node
# creates would have no fate, and the document would be refused for that instead --
# which is not what this fixture is for.
spec_version: "0.0"
features:
  - node_map
types:
  Cup: {domain: object}
processes:
  make:
    kind: atomic
    inputs: {label: {type: String, phase: data}}
    outputs: {cup: {type: Cup, phase: data}}
    objects:
      create: [outputs.cup]
  main:
    kind: composite
    inputs: {labels: {type: Array<String>, phase: data}}
    outputs: {cups: {type: Array<Cup>, phase: data}}
    body:
      nodes:
        - id: make_cups
          kind: map
          process: make
          each:
            label: {from: inputs.labels}
      returns:
        cups: {from: make_cups.cup}
entry: main
