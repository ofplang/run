# Environment for composite_contract.workflow.yaml. `score` is a device-less
# Pure-Data-only script process (§22.1 / §5.5): no device, no spot, duration 1. The
# scheduler requires at least one device to exist, so a single unused rack is
# declared (no script op ever touches it).
time:
  unit: second

devices:
  - { id: rack, spots: [slot] }
transporters:
  - { id: arm }
transports: []

processes:

  score:
    modes:
      - { id: v0, duration: 1 }

objective:
  kind: makespan
