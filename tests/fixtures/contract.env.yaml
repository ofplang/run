# Environment for contract.workflow.yaml. `score` and `report` are device-less
# Pure-Data-only script processes (§22.1 / §5.5): no device, no spot. `report`
# runs after `score` (Pure Data precedence), so the makespan is 2 + 1 = 3. The
# scheduler requires at least one device to exist, so a single unused rack is
# declared (no script op ever touches it).
time:
  unit: second

devices:
  - { id: rack, spots: [slot] }
transporters:
  - { id: arm }
transports: []

processes:

  score:
    modes:
      - { id: v0, duration: 2 }

  report:
    modes:
      - { id: v0, duration: 1 }

objective:
  kind: makespan
