# Two trays in one oven — the environment for stopped_job.document.yaml.
#
# `bake` declares **`device_access: false`** (SPEC §4.4.2): the plate rests on a tray
# for its twenty seconds without holding the oven, so both trays can be in use at
# once. That makes the *trays* the scarce thing rather than the machine, which is the
# whole point — a plate left on one tray by a job that stopped costs the others their
# parallelism, and that is visible in the makespan.
#
# Otherwise as small as it can be: a bench to make plates on, the oven, a bin, one arm.

time:
  unit: second

devices:
  - id: bench
    spots: [slot_a, slot_b]
  - id: oven
    spots: [tray_1, tray_2]
  - id: bin
    spots: [chute]

transporters:
  - id: arm

transports:
  - { transporter: arm, from: bench.slot_a, to: oven.tray_1, duration: 1 }
  - { transporter: arm, from: bench.slot_a, to: oven.tray_2, duration: 1 }
  - { transporter: arm, from: bench.slot_b, to: oven.tray_1, duration: 1 }
  - { transporter: arm, from: bench.slot_b, to: oven.tray_2, duration: 1 }
  - { transporter: arm, from: oven.tray_1, to: bin.chute, duration: 1 }
  - { transporter: arm, from: oven.tray_2, to: bin.chute, duration: 1 }

processes:

  make_plate:
    modes:
      - id: slot_a
        devices: [bench]
        duration: 2
        output_spots: { plate: bench.slot_a }
      - id: slot_b
        devices: [bench]
        duration: 2
        output_spots: { plate: bench.slot_b }

  assay:
    modes:
      - id: tray_1
        devices: [oven]
        device_access: false
        duration: 20
        input_spots:  { plate: oven.tray_1 }
        output_spots: { out: oven.tray_1 }
      - id: tray_2
        devices: [oven]
        device_access: false
        duration: 20
        input_spots:  { plate: oven.tray_2 }
        output_spots: { out: oven.tray_2 }

  discard:
    modes:
      - devices: [bin]
        duration: 1
        input_spots: { plate: bin.chute }
