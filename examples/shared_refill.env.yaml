# Environment for shared_refill.workflow.yaml — one reader holding a limited stock.
#
# `reader` declares a consumable `reagent` with a capacity of 6 (SPEC §5.2): the
# most it can ever hold, not what it holds now. What it holds when the run begins
# is a property of the run, so it is in the run document instead
# (shared_refill.run.yaml, SPEC §6.10).
#
# `assay` draws 2 units per run, written in the qualified form `<device>.<resource>`
# because a mode may name more than one device (SPEC §5.5). Two readers would each
# hold their own independent `reagent`.
#
# `dispenser` can refill the reader, so a stock that runs low is topped up rather
# than ending the run. A refill fills the device to capacity and holds two machines
# while it works — the reader and the dispenser — so it competes with the assays for
# the reader (SPEC §4.7.1).
#
# Deleting `replenishers` and `replenishments` is a legitimate environment too: it
# describes a stock an operator tops up outside the schedule. Reachability is
# presence in the table, so a device no entry names simply has stocks that only fall.
#
# `objective` is omitted, so it defaults to `[makespan, replenishment_count]`
# (SPEC §5.8). Without that second stage a refill that delays nothing is free, and
# the plan may carry refills that serve no purpose.

time:
  unit: second

devices:
  - id: bench
    spots: [slot_a, slot_b]
  - id: reader
    spots: [stage]
    resources:
      reagent: { capacity: 6 }
  - id: bin
    spots: [chute]

transporters:
  - id: arm

replenishers:
  - id: dispenser

replenishments:  # a missing (replenisher, device) pair means "cannot refill it"
  - { replenisher: dispenser, device: reader, duration: 4 }

transports:
  - { transporter: arm, from: bench.slot_a, to: reader.stage, duration: 2 }
  - { transporter: arm, from: bench.slot_b, to: reader.stage, duration: 2 }
  - { transporter: arm, from: reader.stage, to: bin.chute, duration: 2 }

processes:

  make_plate:
    modes:
      - id: slot_a
        devices: [bench]
        duration: 3
        output_spots: { plate: bench.slot_a }
      - id: slot_b
        devices: [bench]
        duration: 3
        output_spots: { plate: bench.slot_b }

  assay:
    modes:
      - devices: [reader]
        duration: 10
        input_spots:  { plate: reader.stage }
        output_spots: { out: reader.stage }
        consumption:  { reader.reagent: 2 }

  discard:
    modes:
      - devices: [bin]
        duration: 1
        input_spots: { plate: bin.chute }
