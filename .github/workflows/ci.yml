name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # `ofplang-schedule` is a sibling repo, not on PyPI. Install it from git so
      # the runner's schedule-dependent tests (importorskip'd otherwise) run.
      - run: pip install "ofplang-schedule @ git+https://github.com/ofplang/schedule.git@main"
      - run: pip install -e ".[test]"
      - run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check ofplang tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # mypy resolves `ofplang.schedule`, so install the sibling repo from git too.
      - run: pip install "ofplang-schedule @ git+https://github.com/ofplang/schedule.git@main"
      - run: pip install -e ".[dev]"
      - run: mypy
