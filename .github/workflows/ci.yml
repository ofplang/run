name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # `ofplang-schedule` (schedule-dependent tests) and `ofplang-validate` (CLI
      # front door) are siblings resolved from PyPI by the `.[test]` install below.
      - run: pip install -e ".[test]"
      - run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # ruff is a static analyzer: it needs neither the project installed nor the
      # (PyPI-absent) ofplang-schedule dependency resolved, so install ruff alone.
      - run: pip install "ruff>=0.16"
      # The whole tree, so `examples/` is linted too (ruff's own defaults skip
      # build/venv dirs and honour .gitignore).
      - run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # mypy resolves `ofplang.schedule` and `ofplang.validate`; the `.[dev]` install
      # pulls both from PyPI.
      - run: pip install -e ".[dev]"
      - run: mypy
