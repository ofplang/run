[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ofplang-run"
version = "0.0.0"
description = "Object-flow programming language v0 runner"
requires-python = ">=3.10"
# `ofplang-schedule` and `ofplang-validate` are local sibling repos (not
# published); install them editable alongside this one:
#   pip install -e ../ofplang-schedule -e ../ofplang-validate
# The rolling-horizon runner (`ofp-run run`) calls schedule in-process; `ofp-run
# replay` does not need it. ofplang-validate is imported only by the CLI front
# door (cli.py) to validate a workflow once before running; the runner library
# never calls it, so library users take no validation overhead.
dependencies = ["PyYAML>=6.0", "ofplang-schedule", "ofplang-validate"]

[project.optional-dependencies]
test = ["pytest>=7.0"]
dev = ["pytest>=7.0", "ruff>=0.16", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
# Standalone command; the umbrella `ofp` CLI (separate repo) exposes this as
# `ofp run`.
ofp-run = "ofplang.run.cli:main"

# `ofplang` is a PEP 420 namespace shared across the org's repos (validate,
# schedule, run, …); this distribution provides only the `ofplang.run` package
# under it.
[tool.setuptools.packages.find]
include = ["ofplang*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "W"]

[tool.mypy]
python_version = "3.10"
files = ["ofplang"]
# `ofplang` is a PEP 420 namespace package (no __init__.py), so tell mypy how to
# root it rather than letting it guess module names.
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

# The sibling ofplang.schedule pulls in ortools/numpy, whose stubs use 3.12-only
# syntax that fails to parse under python_version 3.10. Don't follow into them.
[[tool.mypy.overrides]]
module = ["numpy.*", "ortools.*"]
follow_imports = "skip"
