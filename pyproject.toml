[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ofplang-run"
description = "Runner for Object-flow Programming Language workflows."
requires-python = ">=3.10"
dynamic = ["version"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kazunari Kaizu", email = "kwaizu@gmail.com" }]
keywords = ["ofplang", "dataflow", "workflow", "runner", "rolling-horizon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
# `ofplang-schedule` (called in-process by the rolling-horizon runner) and
# `ofplang-validate` (CLI front door only) are sibling packages, resolved from
# PyPI. The `ofplang-schedule>=0.2.4` floor is required, not merely tested against:
# this runner holds only the devices a mode *accesses* (`device_access: false`, spec
# §4.4.2 -- material resting in a refrigerator occupies a slot, not the machine), and
# 0.2.4 is where the scheduler learned that key. An older one refuses such an
# environment outright with `unknown_key`, so there would be no plan to execute.
# 0.2.3 was the previous requirement: the runner *executes* refills, and it is where
# a running refill is held to `now + margin` like any other running activity. Against
# an older scheduler a refill that overran was reported free the moment its estimate
# said so, and the run stopped with `device busy` -- which is how that bug was found.
# 0.2.0 is where the execution document may carry `inventories` at all, and where the
# `machine_id_conflict` rename and the ortools 9.15 floor landed. Before that,
# `>=0.1.6` was the requirement: every replan hands the scheduler the workflow, the
# environment and the status as in-memory documents, and 0.1.6 is where it takes the
# environment and the execution document that way (0.1.3 was the workflow alone).
# The `ofplang-validate>=0.1.5` floor is required by the shared front door
# (`app.py`): it uses validate's `$import` expansion API (`expand` /
# `validate(..., expand=True)`, 0.1.3) so the runner runs exactly what was validated,
# and 0.1.5 is where `validate()` takes an already-loaded document, which is what
# gives the in-memory route a front door at all.
dependencies = ["PyYAML>=6.0", "ofplang-schedule>=0.2.4", "ofplang-validate>=0.1.5"]

[project.urls]
Homepage = "https://github.com/ofplang/run"
Repository = "https://github.com/ofplang/run"

[project.optional-dependencies]
test = ["pytest>=7.0"]
dev = ["pytest>=7.0", "ruff>=0.16", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
# Standalone command; the umbrella `ofp` CLI (separate repo) exposes this as
# `ofp run`.
ofp-run = "ofplang.run.cli:main"

# Version is derived from git tags (e.g. `v0.1.0`) by setuptools-scm; there is no
# static version in this file.
[tool.setuptools_scm]

# `ofplang` is a PEP 420 namespace shared across the org's repos (validate,
# schedule, run, …); this distribution provides only the `ofplang.run` package
# under it.
[tool.setuptools.packages.find]
include = ["ofplang*"]
namespaces = true

# Ship the PEP 561 marker so downstreams see this package as typed.
[tool.setuptools.package-data]
"ofplang.run" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "W"]

[tool.mypy]
python_version = "3.10"
# `examples/` is checked too: the scripts are the documented way to drive the
# runner, so a type error there is a claim about the API that no longer holds.
files = ["ofplang", "examples"]
# `ofplang` is a PEP 420 namespace package (no __init__.py), so tell mypy how to
# root it rather than letting it guess module names.
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

# The sibling ofplang.schedule pulls in ortools/numpy, whose stubs use 3.12-only
# syntax that fails to parse under python_version 3.10. Don't follow into them.
[[tool.mypy.overrides]]
module = ["numpy.*", "ortools.*"]
follow_imports = "skip"
